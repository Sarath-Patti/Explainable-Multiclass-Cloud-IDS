services:
  # FastAPI REST API & Inference Backend Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: xai-cloud-ids-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=["http://localhost", "http://localhost:5173", "http://localhost:80", "http://127.0.0.1"]
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ids-network

  # React Frontend Dashboard & Nginx Web Server Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: xai-cloud-ids-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ids-network

networks:
  ids-network:
    driver: bridge
